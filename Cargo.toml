[package]
name = "agent-usage"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A minimalist, animated desktop app."

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }
ureq = { version = "3.5.1", default-features = false, features = ["json", "rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
